name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install strace
        run: sudo apt-get update -q && sudo apt-get install -y -q strace
      - run: strace -V | head -1
      - run: npm test

  demo:
    # Runs the README examples on a runner with real internet access.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install strace and the Hugging Face CLI
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q strace
          pipx install 'huggingface_hub[cli]'
      - name: No-network script (expect 0 egress)
        run: node bin/phonehome.js -- node examples/no-network.js
      - name: Egress script (expect detection and exit 1)
        run: |
          set +e
          node bin/phonehome.js -- node examples/egress-demo.js
          code=$?
          echo "exit code: $code"
          test "$code" = 1
      - name: Same script with an allowlist (expect exit 0)
        run: node bin/phonehome.js --allow example.com -- node examples/egress-demo.js
      - name: Real tool, online then offline
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          node bin/phonehome.js --json -- hf download openai-community/gpt2 config.json > online.json || true
          node -e "const j=require('./online.json');console.log(j.result, j.lookups.map(l=>l.name).join(' '))"
          node bin/phonehome.js -- hf download openai-community/gpt2 config.json || true
          node bin/phonehome.js --opt-out-env -- hf download openai-community/gpt2 config.json
      - name: Static scan of the downloaded snapshot
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: node bin/phonehome.js scan "$HF_HOME/hub/models--openai-community--gpt2" --fail-on high
